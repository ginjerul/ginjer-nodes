on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build Nodes
        id: nodes
        continue-on-error: true
        run: |
          cd nodes
          ./gradlew clean build --console=plain 2>&1 | tee ../nodes-build.log
          exit ${PIPESTATUS[0]}

      - name: Build NodesMap
        id: nodesmap
        continue-on-error: true
        run: |
          cd nodesmap
          chmod +x gradlew
          ./gradlew clean build --console=plain 2>&1 | tee ../nodesmap-build.log
          exit ${PIPESTATUS[0]}

      # surface compiler/lint errors as annotations so they show on the run summary
      - name: Report build errors
        if: steps.nodes.outcome == 'failure' || steps.nodesmap.outcome == 'failure'
        env:
          NODES: ${{ steps.nodes.outcome }}
          NODESMAP: ${{ steps.nodesmap.outcome }}
        run: |
          report() {
            msg=$(grep -E "^e: |What went wrong|Lint error|\.kt:[0-9]+:[0-9]+ [A-Z]|Could not resolve|> Task .*FAILED" "$2" | grep -v "^w: " | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$1 build failed::$msg"
          }
          if [ "$NODES" = "failure" ]; then report nodes nodes-build.log; fi
          if [ "$NODESMAP" = "failure" ]; then report nodesmap nodesmap-build.log; fi
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            nodes/build/libs/*.jar
            nodesmap/build/libs/*.jar

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: |
         cd dynmap
         npm install
         rustup target add wasm32-unknown-unknown
         cargo install -f --version 0.2.100 wasm-bindgen-cli
         npm run wasm
         npm run build
         zip -r dynmap.zip build/*
         
      - if: github.event_name == 'push'
        id: get_version
        run: |
          VERSION=""
          if [ -f "nodes/build.gradle.kts" ]; then
            VERSION=$(grep -E "version\s*=\s*['\"]" nodes/build.gradle.kts | sed -E "s/.*version\s*=\s*['\"]([^'\"]+)['\"].*/\1/" | head -n 1)
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not determine version"
            exit 1
          fi
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - if: github.event_name == 'push'
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - if: github.event_name == 'push' && steps.check_release.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          NODES_JAR=nodes/build/libs/nodes-$VERSION.jar
          DYNMAP_ZIP=dynmap/dynmap.zip
          NODESMAP_JAR=$(ls nodesmap/build/libs/nodesmap-*.jar | head -n 1)
          ALL="$NODES_JAR $DYNMAP_ZIP $NODESMAP_JAR"
          if [ -z "$ALL" ]; then
            echo "No build files found"
            exit 1
          fi
          echo "Found build files: $ALL"
          gh release create "v$VERSION" $ALL \
            --title "Release v$VERSION" \
            --notes "Automated release for version $VERSION."
