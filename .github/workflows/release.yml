name: Release

on:
  release:
    types: [ created ]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          cd nodes
          ./gradlew clean build
          cd ../nodesmap
          chmod +x gradlew
          ./gradlew clean build

      - name: Upload JAR to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nodes/build/libs/*.jar
            nodesmap/build/libs/*.jar
