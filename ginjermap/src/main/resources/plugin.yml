main: phonon.ginjermap.GinjerMapPlugin
name: GinjerMap
version: ${version}
api-version: '1.21'
description: Lightweight live web map built for Nodes
softdepend: [kotlin, nodes]

commands:
  ginjermap:
    description: Ginjer Map web map commands
    aliases: [nodesmap, gmap]
    usage: /ginjermap help

permissions:
  ginjermap.admin:
    description: Use /ginjermap admin commands
    default: op
  ginjermap.link:
    description: Get a link to the web map (/ginjermap link)
    default: true
  ginjermap.editor:
    description: Open the web map editor (/ginjermap editor)
    default: op
  ginjermap.shards:
    description: Edit the server regions (Reef sharding) in the web map editor
    default: op
  ginjermap.hidden:
    description: Player is never shown on the web map
    default: false
