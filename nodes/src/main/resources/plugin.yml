  nodes.command.chat.nation:
    default: true
  nodes.command.chat.ally:
    default: true
  nodes.command.chat.local:
    default: true
  nodes.command.chat.rp:
    default: true
  nodes.command.player:
    default: true
  nodes.command.territory:
    default: true
  nodes.command.port:
    default: true
  nodes.command.town.fly:
    default: op
  nodes.warzone.status:
