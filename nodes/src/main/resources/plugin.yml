main: phonon.nodes.NodesPlugin
name: nodes
version: 0.1.0
api-version: 1.16
softdepend: [kotlin, Essentials, Votifier, packetevents]

commands:
  nodesadmin:
    description: Admin commands for Nodes
    aliases: [nda]
    usage: /nodesadmin help or /na help
  town:
    description: Manage player towns (Nodes)
    aliases: [t]
    permission: nodes.command.town
    usage: /town help or /t help
  nation:
    description: Manage player nations (Nodes)
    aliases: [n]
    permission: nodes.command.nation
    usage: /nation help or /n help
  nodes:
    description: Nodes general info (Nodes)
    aliases: [nd]
    permission: nodes.command.nodes
    usage: /nodes help or /nd help
  ally:
    description: Make alliance with another town/nation
    permission: nodes.command.ally
    usage: /ally help
  unally:
    description: Break alliance with another town/nation
    permission: nodes.command.unally
    usage: /unally help
  war:
    description: Declare war on another town/nation
    permission: nodes.command.war
    usage: /war help
  peace:
    description: Request peace with another town/nation
    permission: nodes.command.peace
    usage: /peace help
  truce:
    description: View truce list and times remaining
    permission: nodes.command.truce
    usage: /truce help
  globalchat:
    description: Set player chat to global
    aliases: [gc]
    permission: nodes.command.chat.global
    usage: /globalchat or /gc
  townchat:
    description: Set player chat to town
    aliases: [tc]
    permission: nodes.command.chat.town
    usage: /townchat or /tc
  nationchat:
    description: Set player chat to nation
    aliases: [nc]
    permission: nodes.command.chat.nation
    usage: /nationchat or /nc
  allychat:
    description: Set player chat to allies
    aliases: [ac]
    permission: nodes.command.chat.ally
    usage: /allychat or /ac
  localchat:
    description: Set player chat to local (nearby players only)
    aliases: [lc]
    permission: nodes.command.chat.local
    usage: /localchat or /lc
  rpchat:
    description: Set player chat to roleplay (nearby players only)
    aliases: [rp]
    permission: nodes.command.chat.rp
    usage: /rpchat or /rp
  player:
    description: View player info
    permission: nodes.command.player
    usage: /player [name]
  territory:
    description: View territory info
    permission: nodes.command.territory
    usage: /territory or /territory [id]
  port:
    description: Port warps
    permission: nodes.command.port
    usage: /port help
  warzone:
    description: Warzone commands
    aliases: [wz]
    usage: /warzone help
  miningtower:
    description: Place and manage mining towers
    aliases: [mt]
    permission: nodes.command.miningtower
    usage: /mt help
  refinery:
    description: Manage and use refineries
    aliases: [rf, refineries]
    permission: nodes.command.refinery
    usage: /refinery help
  stats:
    description: View kill/death stats
    aliases: [kdr]
    usage: /stats [player]
  leaderboard:
    description: KDR leaderboards
    aliases: [lb]
    usage: /leaderboard <kills|deaths|kdr|towns|nations|war>
  plot:
    description: Town plots
    aliases: [p]
    usage: /plot help
    permission: nodes.command.plot
    permission-message: You do not have permission to use plot commands.
  killshop:
    description: Kill event shop
    usage: /killshop
    permission: nodes.command.killshop
    permission-message: You do not have permission to use killshop.
  vassal:
    description: Vassals and overlords
    aliases: [vassals]
    permission: nodes.command.vassal
    usage: /vassal help
  surrender:
    description: Join another nation with your town
    permission: nodes.command.surrender
    usage: /surrender <nation>
  bounty:
    description: Ore bounties on players
    aliases: [bounties]
    permission: nodes.command.bounty
    usage: /bounty help
  economy:
    description: National economy and banking
    aliases: [ne]
    permission: nodes.command.economy
    usage: /economy help
  economyadmin:
    description: Economy administration
    aliases: [nea]
    permission: nodes.economy.admin
    usage: /economyadmin help
  supplydrop:
    description: Supply drops
    aliases: [sd]
    permission: nodes.command.supplydrop
    usage: /supplydrop help
  raid:
    description: Territory raids
    usage: /raid <town> <territoryId> | status | cancel
    permission: nodes.command.raid
# ALL permission nodes live here — NOT under commands
permissions:
  nodes.admin:
    description: Nodes admin, every /nodesadmin command
    default: op
    children:
      nodes.admin.reload: true
      nodes.admin.war: true
      nodes.admin.surrender: true
      nodes.admin.port: true
      nodes.admin.resident: true
      nodes.admin.town: true
      nodes.admin.nation: true
      nodes.admin.enemy: true
      nodes.admin.peace: true
      nodes.admin.ally: true
      nodes.admin.allyremove: true
      nodes.admin.truce: true
      nodes.admin.truceremove: true
      nodes.admin.treaty: true
      nodes.admin.save: true
      nodes.admin.load: true
      nodes.admin.runincome: true
      nodes.admin.playersonline: true
      nodes.admin.debug: true
      nodes.admin.miningboost: true
      nodes.admin.stats: true
      nodes.admin.socialspy: true
      nodes.admin.pvp: true
      nodes.admin.inactive: true
      nodes.admin.rallycap: true
      nodes.admin.announce: true
      nodes.admin.plot: true
